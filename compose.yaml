services:
  form-studio:
    image: form-studio:1.2.0
    pull_policy: build
    build:
      context: .
      args:
        APP_UID: "${APP_UID:-1000}"
        APP_GID: "${APP_GID:-1000}"
    init: true
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${FORM_STUDIO_PORT:-8785}:8080"
    environment:
      FORM_STUDIO_BED_SIZE: "${FORM_STUDIO_BED_SIZE:-256,256,256}"
      LAYER_LIBRARY_URL: "${LAYER_LIBRARY_URL:-}"
    volumes:
      - form-studio-data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=16777216,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  form-studio-data:
