name: Test and build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Test server and configuration
        run: python -m unittest discover -s tests -p '*_test.py'
      - name: Test geometry, renderer and randomisation
        run: npm test
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and start container
        env:
          BIND_ADDRESS: 127.0.0.1
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Check HTTP service
        run: |
          curl --fail --silent http://127.0.0.1:8785/api/health
          curl --fail --silent --output /dev/null http://127.0.0.1:8785/
      - name: Show container logs
        if: always()
        run: docker compose logs --no-color --tail=100
      - name: Remove test containers and volumes
        if: always()
        run: docker compose down --volumes

